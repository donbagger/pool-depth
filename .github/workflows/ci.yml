name: ci

# Offline tests on every push and pull request, plus a daily run against the live API so
# a change on the API side shows up here before it shows up in someone's terminal.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m unittest -v
      - name: The pool-depth command installs and runs
        run: |
          pip install --no-deps .
          pool-depth --version

  live:
    # Not on pull requests: the keyless rate limit is shared, and a fork PR should not be
    # able to spend it or fail on someone else's traffic.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.txt
      - run: python smoke.py
